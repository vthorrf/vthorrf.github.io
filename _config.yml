# General site behavior
teaser:
breadcrumbs: false
words_per_minute: 160
future: false
read_more: "disabled"
talkmap_link: false

comments:
  provider:

atom_feed:
  hide: true

# SEO
google_site_verification:
bing_site_verification:
yandex_site_verification:
og_image: "/images/profile.jpg"
og_description: "Academic website of Víthor Rosa Franco: psychometrics, mathematical psychology, Bayesian methods, software, teaching, and publications."

twitter:
  username: "vthorrf"

social:
  type: Person
  name: "Víthor Rosa Franco"
  links:
    - "https://orcid.org/0000-0002-8929-3238"
    - "https://scholar.google.com/citations?user=9ofPywUAAAAJ"
    - "https://github.com/vthorrf"
    - "https://www.linkedin.com/in/vithorfranco/"
    - "https://www.researchgate.net/profile/Vithor_Franco"

# Analytics (disabled until a tracking ID is intentionally added)
analytics:
  provider: "false"
  google:
    tracking_id:

# Files and Markdown
include:
  - _pages

exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Gemfile
  - LICENSE
  - node_modules
  - README.md
  - tmp
  - vendor

keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Page defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Output
permalink: /:categories/:title/
timezone: America/Sao_Paulo

# Plugins supported by GitHub Pages
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# HTML compression
compress_html:
  clippings: all
  ignore:
    envs: development
